[package]
name = "history-flow"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "History Flow visualization for Wikipedia and Git — author-colored stacked-bar chart showing document evolution with provenance-based attribution"
repository = "https://github.com/andrefs/history-flow"
homepage = "https://github.com/andrefs/history-flow"
documentation = "https://docs.rs/history-flow"
readme = "README.md"
categories = ["visualization", "command-line-utilities", "web-programming"]
keywords = [
  "history-flow",
  "wikipedia",
  "git",
  "visualization",
  "vega-lite",
  "attribution",
]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13.4", default-features = false, features = [
  "blocking",
  "json",
  "query",
  "rustls",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
similar = "3"
thiserror = "2"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.7", features = ["fs"] }
