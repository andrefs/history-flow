[package]
name = "history-flow"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13.4", default-features = false, features = [
  "blocking",
  "json",
  "query",
  "rustls",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
